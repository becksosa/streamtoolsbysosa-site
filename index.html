<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stream Tools by Sosa</title>

<!--  their filenames below. The gallery cycles one every 4 seconds.       -->

    "quasimoto_icecube.jpg",
    "kobejesus.jpg",
    "8ball.jpg",
    "alienpoker.jpg",
    "camel.jpg",
    "cartijesus.jpg",
    "doom.jpg",

  ];
</script>

<!-- ===================================================================== -->

<!--  Add { title, url } objects. Titles show on the site; URLs are the    -->
<!--  YouTube (or any) links each title points to.                         -->
<!-- ===================================================================== -->
<script>
  const OTHER_WORK = [
    { title: "NFL Overlay with stash or pass, see 2 pick 1, and other animations", url: "https://www.youtube.com/watch?v=RRFtx-lGIfY" },
    { title: "MLB Overlay", url: "https://www.youtube.com/watch?v=nkylMmPNE2s" },
  ];
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    /* ---- frame inner-cutout geometry (computed from real PNG dims) ---- */
    --f1-w: 72.616%;  --f1-h: 72.614%;  --f1-l: 13.692%;  --f1-t: 13.693%;
    --f2-w: 71.997%;  --f2-h: 77.508%;  --f2-l: 14.001%;  --f2-t: 11.246%;
    --f3-w: 56.958%;  --f3-h: 59.358%;  --f3-l: 21.521%;  --f3-t: 20.321%;

    --neon:   #ff8a1e;
    --neon-2: #ffd23f;
    --ember:  #ff3d2e;
    --ink:    #0a0b0d;
    --panel:  rgba(18,20,24,.78);
    --line:   rgba(255,255,255,.14);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }
  body{
    font-family:"Oswald",sans-serif;
    background:#070708;
    color:#e9e6df;
    overflow-x:hidden;
    min-height:100vh;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{
    position:fixed; inset:0;
    background:url("assets/png_gif/background.jpg") center top / cover no-repeat;
    z-index:-3;
  }
  .bg::after{                      /* dim + vignette so frames pop */
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 18%, rgba(0,0,0,.10), rgba(4,4,6,.86) 78%),
      linear-gradient(180deg, rgba(6,6,8,.55), rgba(6,6,8,.78));
  }
  .grain{                          /* subtle moving scanline atmosphere */
    position:fixed; inset:0; z-index:-2; pointer-events:none; opacity:.05;
    background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);
    animation:scan 8s linear infinite;
  }
  @keyframes scan{ to{ transform:translateY(3px);} }

  /* ---------- FLOATING HEADER ELEMENTS (no panel, pinned to corners) ---------- */
  .brand{
    position:absolute; z-index:20;
    top:22px; left:clamp(18px,4vw,56px);
    width:clamp(150px,16vw,230px);
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));
    transform-origin:50% 50%;
    cursor:pointer;
  }
  .brand img{ width:100%; display:block; }

  .contact-wrap{
    position:absolute; z-index:20;
    top:22px; right:clamp(18px,4vw,56px);
    display:flex; align-items:center; gap:12px;
  }
  .arrow{
    width:clamp(54px,5vw,76px); flex:none;
    opacity:0;                          /* hidden until it plays */
    transform:translateY(2px);
  }
  .arrow.playing{ opacity:1; }
  .contact{
    background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter:blur(8px);
    border-radius:12px;
    padding:14px 18px; min-width:230px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .contact h3{
    font-family:"Bebas Neue",sans-serif; letter-spacing:1.5px;
    font-size:15px; color:var(--neon-2); margin-bottom:8px; font-weight:400;
  }
  .contact a, .contact .phone{
    display:flex; align-items:center; gap:9px;
    font-size:15px; color:#e9e6df; text-decoration:none;
    padding:4px 0; transition:color .18s, transform .18s;
  }
  .contact a:hover{ color:var(--neon); transform:translateX(3px); }
  .contact .ico{ width:20px; height:20px; object-fit:contain; flex:none; }
  .contact .ico--nokia{ width:22px; height:22px; }

  /* ---------- STAGE / LAYOUT ---------- */
  main{
    position:relative; z-index:3;
    max-width:1180px; margin:0 auto;
    padding:150px clamp(16px,4vw,40px) 220px;
  }
  .eyebrow{
    text-align:center; font-family:"Bebas Neue",sans-serif;
    letter-spacing:6px; font-size:clamp(13px,1.4vw,16px);
    color:var(--neon); opacity:.9; margin-bottom:6px;
  }
  .tagline{
    text-align:center; font-weight:300; letter-spacing:2px;
    color:#b9b4ab; font-size:clamp(13px,1.5vw,16px);
    margin-bottom:clamp(26px,4vw,46px); text-transform:uppercase;
  }

  /* a "frame" = the PNG as background, with a content slot inset to the cutout */
  .frame{ position:relative; width:100%; }
  .frame::before{                 /* the ornate PNG */
    content:""; position:absolute; inset:0;
    background-size:100% 100%; background-repeat:no-repeat;
    pointer-events:none; z-index:2;
    filter:drop-shadow(0 18px 34px rgba(0,0,0,.55));
  }
  .frame .slot{
    position:absolute; z-index:1; overflow:hidden;
    background:#0c0d10; border-radius:3px;
  }

  /* Frame 1 — Video (16:9) */
  .frame--video{ aspect-ratio:2496 / 1404; max-width:1060px; margin:0 auto; }
  .frame--video::before{ background-image:url("assets/png_gif/ornate_frame.png"); }
  .frame--video .slot{
    width:var(--f1-w); height:var(--f1-h); left:var(--f1-l); top:var(--f1-t);
  }
  .frame--video iframe{ width:100%; height:100%; border:0; display:block; }

  .lower{
    display:flex; justify-content:center; align-items:flex-start;
    gap:clamp(24px,5vw,70px); flex-wrap:wrap;
    margin-top:clamp(34px,5vw,60px);
  }

  /* Frame 2 — Other Work */
  .frame--work{ aspect-ratio:736 / 955; width:clamp(280px,34vw,360px); }
  .frame--work::before{ background-image:url("assets/png_gif/ornate_frame_2.png"); }
  .frame--work .slot{
    width:var(--f2-w); height:var(--f2-h); left:var(--f2-l); top:var(--f2-t);
    background:rgba(12,13,16,.92);
    display:flex; flex-direction:column;
  }

  /* Frame 3 — Interesting Photos */
  .frame--photos{ aspect-ratio:1 / 1; width:clamp(300px,36vw,400px); }
  .frame--photos::before{ background-image:url("assets/png_gif/ornate_frame_3.png"); }
  .frame--photos .slot{
    width:var(--f3-w); height:var(--f3-h); left:var(--f3-l); top:var(--f3-t);
  }

  .slot-title{
    font-family:"Bebas Neue",sans-serif; letter-spacing:2px;
    text-align:center; color:var(--neon-2);
    padding:12px 10px 8px; font-size:clamp(16px,1.8vw,20px); flex:none;
    border-bottom:1px solid rgba(255,255,255,.08);
  }

  /* Other-work link list */
  .work-list{ list-style:none; overflow-y:auto; padding:6px 10px 12px; flex:1; }
  .work-list li{ margin:4px 0; }
  .work-list a{
    display:block; text-decoration:none; color:#e4e0d8;
    font-size:14px; font-weight:400; letter-spacing:.4px;
    padding:9px 11px; border:1px solid rgba(255,255,255,.10);
    border-radius:7px; background:rgba(255,255,255,.03);
    transition:.18s; position:relative;
  }
  .work-list a::before{ content:"▸ "; color:var(--neon); opacity:.7; }
  .work-list a:hover{
    background:rgba(255,138,30,.12); border-color:var(--neon);
    transform:translateX(4px); color:#fff;
  }

  /* Photo cycler */
  .cycler{ position:absolute; inset:0; }
  .cycler img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0; transition:opacity 1s ease;
  }
  .cycler img.show{ opacity:1; }
  .cycler .empty{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; text-align:center;
    color:#7d7a72; font-size:13px; letter-spacing:1px; padding:18px;
  }
  .cycler .empty b{ color:var(--neon); font-family:"Bebas Neue"; letter-spacing:2px; font-size:18px; }

  /* ---------- SKELETON FLOOR ---------- */
  .floor{
    position:fixed; left:0; right:0; bottom:0; height:170px; z-index:4;
    background:url("assets/png_gif/skeleton_running_bg.png") repeat-x bottom center;
    background-size:auto 170px;
    pointer-events:none;
  }
  .skeleton{
    /* SAME height as the floor bg, BOTH anchored bottom:0 -> floors line up */
    position:absolute; bottom:0; height:170px; width:auto;
    left:-20vw; opacity:0;
  }
  .skeleton.run{ animation:dash 5.5s linear; }
  @keyframes dash{
    0%   { left:-20vw; opacity:0; }
    6%   { opacity:1; }
    94%  { opacity:1; }
    100% { left:110vw; opacity:1; }
  }

  /* ---------- ENTRANCE ANIMATIONS ---------- */
  .reveal{ opacity:0; }
  .is-in.fade-up{ animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .is-in.from-left{ animation:fromLeft 1s cubic-bezier(.2,.8,.2,1) forwards; }
  .is-in.from-right{ animation:fromRight 1s cubic-bezier(.2,.8,.2,1) forwards; }
  .is-in.drop-in{ animation:dropIn 1.1s cubic-bezier(.2,.9,.25,1.15) forwards; }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(34px);} to{opacity:1; transform:none;} }
  @keyframes fromLeft{ from{opacity:0; transform:translateX(-70px) rotate(-2deg);} to{opacity:1; transform:none;} }
  @keyframes fromRight{ from{opacity:0; transform:translateX(70px) rotate(2deg);} to{opacity:1; transform:none;} }
  @keyframes dropIn{ 0%{opacity:0; transform:translateY(-90px) scale(.94);} 60%{opacity:1;} 100%{opacity:1; transform:none;} }

  @keyframes logoPop{
    0%{ transform:scale(1) rotate(0); }
    15%{ transform:scale(1.35) rotate(-7deg); }
    35%{ transform:scale(1.2) rotate(8deg); }
    55%{ transform:scale(1.32) rotate(-5deg); }
    75%{ transform:scale(1.12) rotate(3deg); }
    100%{ transform:scale(1) rotate(0); }
  }

  @keyframes logoSpinPop{
    0%  { transform:scale(1)    rotate(0deg); }
    30% { transform:scale(1.45) rotate(180deg); }
    55% { transform:scale(1.6)  rotate(360deg); }
    72% { transform:scale(0.85) rotate(360deg); }
    85% { transform:scale(1.15) rotate(360deg); }
    100%{ transform:scale(1)    rotate(360deg); }
  }

  /* TIP PHASE: hangs on by the edge — pivots from its bottom-left corner,
     tipping further and further like it's barely holding on, with little
     catches where it almost steadies itself before slipping more. */
  @keyframes logoTip{
    0%  { transform:rotate(0deg); }
    15% { transform:rotate(6deg); }
    25% { transform:rotate(4deg); }   /* small catch — almost holds */
    45% { transform:rotate(13deg); }
    58% { transform:rotate(11deg); }  /* catches again */
    75% { transform:rotate(24deg); }
    88% { transform:rotate(30deg); }
    100%{ transform:rotate(34deg); }  /* right on the brink */
  }

  /* FALL PHASE: thread snaps — drops STRAIGHT DOWN, vertically, off screen.
     Runs while the logo is position:fixed (set by JS) so it escapes the header. */
  @keyframes logoDrop{
    0%  { transform:translateY(0)     rotate(34deg); opacity:1; }
    7%  { transform:translateY(0)     rotate(38deg); }   /* the final slip */
    100%{ transform:translateY(120vh) rotate(50deg); opacity:1; }
  }

  /* SNEAK PHASE: casually slides back in from the left like nothing happened */
  @keyframes logoSneak{
    0%  { transform:translateX(-340px) rotate(-5deg); opacity:0; }
    20% { transform:translateX(-340px) rotate(-5deg); opacity:1; }
    55% { transform:translateX(-140px) rotate(-3deg); }
    80% { transform:translateX(-45px)  rotate(-1deg); }
    93% { transform:translateX(-8px)   rotate(0deg); }
    100%{ transform:translateX(0)      rotate(0deg); opacity:1; }
  }

  .brand.popping,
  .brand.is-in.popping      { animation:logoPop     1.5s cubic-bezier(.2,.9,.25,1.2)  !important; z-index:50; }
  .brand.spin-popping,
  .brand.is-in.spin-popping { animation:logoSpinPop 1.4s cubic-bezier(.3,.8,.25,1.1)  !important; z-index:50; }

  /* falling phases — driven by JS adding these classes in sequence */
  .brand.tipping  { animation:logoTip   2.2s cubic-bezier(.45,.05,.55,.95) forwards !important; z-index:50; transform-origin:0% 100%; }
  .brand.dropping { animation:logoDrop  0.9s cubic-bezier(.45,.05,.75,.6) forwards !important; z-index:9999; transform-origin:0% 100%; }
  .brand.sneaking { animation:logoSneak 2.2s cubic-bezier(.25,.8,.3,1) forwards !important; z-index:50; }
  .brand.fixed-fall{ position:fixed !important; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:760px){
    .brand{ top:16px; left:0; right:0; margin:0 auto; width:clamp(140px,42vw,200px); }
    .contact-wrap{ top:110px; left:0; right:0; margin:0; width:100%; justify-content:center; }
    main{ padding-top:250px; padding-bottom:170px; }
    .lower{ flex-direction:column; align-items:center; }
    .frame--video{ max-width:100%; }
    .frame--work,.frame--photos{ width:min(86vw,360px); }
    .floor{ height:120px; background-size:auto 120px; }
    .skeleton{ height:120px; bottom:0; animation-duration:3s; }
    .skeleton.run{ animation-name:dash-fast; animation-duration:3s; }
  }
  @keyframes dash-fast{
    0%   { left:-20vw; opacity:0; }
    6%   { opacity:1; }
    94%  { opacity:1; }
    100% { left:110vw; opacity:1; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
    .reveal{ opacity:1 !important; }
    .arrow{ opacity:1; }
    .skeleton{ display:none; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>

  <!-- ================= FLOATING LOGO + CONTACT (no header panel) ================= -->
  <div class="brand reveal" id="brand">
    <img src="assets/png_gif/logo.png" alt="Stream Tools by Sosa" />
  </div>

  <div class="contact-wrap reveal" id="contactWrap">
    <img class="arrow" id="arrow" src="assets/png_gif/arrow.gif" alt="" />
    <div class="contact">
      <h3>CONTACT</h3>
      <a href="https://discord.com/users/streamtoolsbysosa" target="_blank" rel="noopener">
        <img class="ico" src="assets/png_gif/discord.png" alt="Discord" /> streamtoolsbysosa
      </a>
      <a href="tel:+16129169978">
        <img class="ico ico--nokia" src="assets/png_gif/nokia.gif" alt="Phone" /> 612-916-9978
      </a>
    </div>
  </div>

  <!-- ================= MAIN ================= -->
  <main>
    <div class="eyebrow reveal" id="eyebrow">NEED A BETTER OBS SETUP?</div>
    <div class="tagline reveal" id="tagline">I GOT WHAT YOU NEED</div>

    <!-- Frame 1: Video -->
    <div class="frame frame--video reveal" id="frameVideo">
      <div class="slot">
        <iframe
          src="https://www.youtube.com/embed/AdDKudyShtY?si=ZIAhPtKkZe_CcKiL&rel=0"
          title="Featured video"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>
    </div>

    <div class="lower">
      <!-- Frame 2: Other Work -->
      <div class="frame frame--work reveal" id="frameWork">
        <div class="slot">
          <div class="slot-title">Other Work</div>
          <ul class="work-list" id="workList"></ul>
        </div>
      </div>

      <!-- Frame 3: Interesting Photos -->
      <div class="frame frame--photos reveal" id="framePhotos">
        <div class="slot">
          <div class="cycler" id="cycler"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ================= SKELETON FLOOR ================= -->
  <div class="floor">
    <img class="skeleton" id="skeleton" src="assets/png_gif/skeleton_running.gif" alt="" />
  </div>

<script>
  /* ---------- Other Work list ---------- */
  (function(){
    const ul = document.getElementById('workList');
    OTHER_WORK.forEach(item=>{
      const li=document.createElement('li');
      const a=document.createElement('a');
      a.href=item.url; a.target="_blank"; a.rel="noopener";
      a.textContent=item.title;
      li.appendChild(a); ul.appendChild(li);
    });
  })();

  /* ---------- Interesting Photos cycler ---------- */
  (function(){
    const box=document.getElementById('cycler');
    const base="assets/png_gif/interesting_photos/";
    if(!INTERESTING_PHOTOS.length){
      box.innerHTML='<div class="empty"><b>Interesting Photos</b>'+
        '<span>Drop images into<br>assets/png_gif/interesting_photos/<br>and list them in the code.</span></div>';
      return;
    }
    const imgs=INTERESTING_PHOTOS.map((name,i)=>{
      const im=document.createElement('img');
      im.src=base+name; im.alt="Interesting photo";
      if(i===0) im.classList.add('show');
      box.appendChild(im); return im;
    });
    let cur=0;
    if(imgs.length>1){
      setInterval(()=>{
        imgs[cur].classList.remove('show');
        cur=(cur+1)%imgs.length;
        imgs[cur].classList.add('show');
      },4000);
    }
  })();

  /* ---------- Entrance choreography ---------- */
  window.addEventListener('load',()=>{
    const seq=[
      ['brand','drop-in',0],
      ['contactWrap','from-right',180],
      ['eyebrow','fade-up',360],
      ['tagline','fade-up',460],
      ['frameVideo','fade-up',560],
      ['frameWork','from-left',820],
      ['framePhotos','from-right',820],
    ];
    seq.forEach(([id,cls,delay])=>{
      const el=document.getElementById(id);
      if(!el) return;
      setTimeout(()=>{ el.classList.remove('reveal'); el.classList.add('is-in',cls); }, delay);
      // Strip entrance classes from brand after it finishes so they never fight logo animations
      if(id==='brand'){
        setTimeout(()=>{ el.classList.remove('is-in','drop-in'); }, delay+1300);
      }
    });
  });

  /* ---------- Logo random animations ---------- */
  (function(){
    const brand=document.getElementById('brand');
    let busy=false;

    function clearAll(){
      brand.classList.remove('popping','spin-popping','tipping','dropping','sneaking','fixed-fall');
      brand.style.left=''; brand.style.top=''; brand.style.width='';
    }

    // simple one-shot animations
    function runSimple(cls,dur){
      if(busy) return; busy=true;
      clearAll();
      void brand.offsetWidth;
      brand.classList.add(cls);
      setTimeout(()=>{ brand.classList.remove(cls); busy=false; }, dur);
    }

    // the multi-phase fall: tip -> snap & drop straight down -> sneak back in
    function runFall(){
      if(busy) return; busy=true;
      clearAll();
      void brand.offsetWidth;

      // PHASE 1: hang on the edge & tip over (~2.2s)
      brand.classList.add('tipping');

      setTimeout(()=>{
        // PHASE 2: thread snaps. Lock the logo to its exact on-screen spot using
        // position:fixed so it can fall STRAIGHT DOWN past everything.
        // (Logo is position:absolute / out of flow, so nothing else can move.)
        const r=brand.getBoundingClientRect();

        brand.classList.remove('tipping');
        brand.style.left = r.left+'px';
        brand.style.top  = r.top +'px';
        brand.style.width= r.width+'px';
        brand.classList.add('fixed-fall');
        void brand.offsetWidth;
        brand.classList.add('dropping'); // 0.9s vertical drop

        setTimeout(()=>{
          // PHASE 3: it's offscreen now. Drop the fixed positioning so it
          // returns to its normal slot, then sneak it in from the left.
          brand.classList.remove('dropping','fixed-fall');
          brand.style.left=''; brand.style.top=''; brand.style.width='';
          void brand.offsetWidth;
          brand.classList.add('sneaking'); // 2.2s casual slide-in

          setTimeout(()=>{
            brand.classList.remove('sneaking');
            busy=false;
          }, 2200);
        }, 950);
      }, 2200);
    }

    function triggerRandom(){
      const roll=Math.floor(Math.random()*3);
      if(roll===0)      runSimple('popping',1600);
      else if(roll===1) runSimple('spin-popping',1500);
      else              runFall();
    }

    brand.addEventListener('click',triggerRandom);

    function schedule(){
      const wait = 7000 + Math.random()*11000; // random 7–18s
      setTimeout(()=>{ triggerRandom(); schedule(); }, wait);
    }
    setTimeout(schedule, 2500); // wait out the entrance drop-in first
  })();

  /* ---------- Arrow plays every 5s ---------- */
  (function(){
    const arrow=document.getElementById('arrow');
    const src="assets/png_gif/arrow.gif";
    function play(){
      arrow.classList.add('playing');
      arrow.src=src+"?t="+Date.now();    // restart the gif from frame 0
      // hide again after one ~1.2s loop so it can replay cleanly
      setTimeout(()=>arrow.classList.remove('playing'),1800);
    }
    play();
    setInterval(play,5000);
  })();

  /* ---------- Skeleton runs across periodically ---------- */
  (function(){
    const sk=document.getElementById('skeleton');
    function run(){
      sk.classList.remove('run');
      void sk.offsetWidth;
      sk.classList.add('run');
    }
    setTimeout(run,2600);                 // first run after load
    setInterval(run, 50000);               // then every 50s
  })();
</script>
</body>
</html>
